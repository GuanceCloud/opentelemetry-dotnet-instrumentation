name: create-release-tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: SemVer tag to create, must start with v (for example v1.14.1-guance.1)
        required: true
        type: string
      target_ref:
        description: Branch, tag, or commit SHA to tag
        required: true
        default: main
        type: string

permissions:
  contents: write

jobs:
  create-tag:
    runs-on: ubuntu-22.04
    steps:
      - name: Validate input
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+(\.[0-9]+){2}([-.][0-9A-Za-z.-]+)?$ ]] || {
            echo "Tag must start with v and follow SemVer, got: ${RELEASE_TAG}" >&2
            exit 1
          }

      - name: Checkout target ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # tag: v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_ref }}

      - name: Ensure tag does not already exist
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags origin
          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "Tag already exists: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Create and push tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" -m "${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"
          echo "Created tag ${RELEASE_TAG} from ${TARGET_REF}"
