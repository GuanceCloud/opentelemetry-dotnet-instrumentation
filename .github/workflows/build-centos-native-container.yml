name: Build on Centos Native Container

on:
  workflow_call:

env:
  NUGET_PACKAGES: ${{ github.workspace }}/packages
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

permissions:
  contents: read

jobs:
  build-centos-native-container:
    strategy:
      fail-fast: false
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # tag: v6.0.2
      with:
        fetch-depth: 0 # fetching all, needed to correctly calculate version
    - name: Build native library in Docker container
      run: |
        set -e
        docker build -t mybuildimage -f "./docker/centos.dockerfile" ./docker
        docker run -e OS_TYPE=linux-glibc --rm --mount type=bind,source="${GITHUB_WORKSPACE}",target=/project mybuildimage \
          /bin/sh -c 'git config --global --add safe.directory /project && printf "{\n  \"sdk\": {\n    \"version\": \"7.0.404\",\n    \"rollForward\": \"latestFeature\"\n  }\n}\n" > /project/global.json && ./build.sh BuildNativeWorkflow'

    - name: Publish native library Linux build
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # tag: v7.0.0
      with:
        name: bin-centos-native
        path: bin/tracer-home
      if: ${{ !cancelled() }}
      continue-on-error: true
